/* Layout: header bar, 5×5 board of tiles, team scoreboard beneath; clues open as a full-screen white card for projecting.
   BRHS Brand on white: Carolina Blue tiles, Clemson Orange for Daily Double and wrong answers, Determined Gray rules. */
:root{
  --CarolinaBlue:#4b9cd3; --DeterminedGray:#cbc4bc; --ClemsonOrange:#f56600;
  --paper:#ffffff; --ink:#1f2a33; --muted:#5f5953; --line:var(--DeterminedGray); --tint:#f5f3f0;
  --blue:var(--CarolinaBlue); --blue-ink:#22679a; --blue-soft:#eaf4fb;
  --orange:var(--ClemsonOrange); --orange-ink:#a94700; --orange-soft:#fff0e5; --orange-pale:#fbb583; --orange-pale-hover:#f9a061;
  --f-display:"KGSummer Sunshine","Comic Sans MS","Chalkboard SE",Arial,sans-serif;
  --f-ui:"Poppins",Arial,Helvetica,sans-serif;
  --f-body:Arial,Helvetica,sans-serif;
  color-scheme:light;
}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue-ink);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}

header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--blue);padding-bottom:10px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(1.7rem,4.5vw,2.8rem);line-height:1.1;margin:0 auto 0 0}
h1 span{color:var(--blue-ink)}
.btn{border:0;border-radius:10px;background:var(--blue);color:var(--ink);font-family:var(--f-ui);font-weight:700;letter-spacing:.05em;padding:10px 16px;font-size:.9rem}
.btn:hover{background:#3a8bc2}
.btn.ghost{background:var(--paper);color:var(--blue-ink);border:2px solid var(--blue)}
.btn.ghost:hover{background:var(--blue-soft)}
.btn.dark{background:var(--ink);color:#fff}
.btn.dark:hover{background:#34434f}
.btn.warn{background:var(--orange);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.note{font-size:.88rem;color:var(--muted);margin:0}

/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.cat{background:var(--ink);color:#fff;border-radius:10px;padding:10px 6px;min-height:64px;display:grid;place-items:center;text-align:center;
  font-family:var(--f-ui);font-weight:700;font-size:clamp(.72rem,1.6vw,1rem);letter-spacing:.04em;line-height:1.2;text-wrap:balance}
.tile{border:0;border-radius:10px;background:var(--orange-pale);min-height:clamp(58px,10vh,96px);display:grid;place-items:center;
  font-family:var(--f-display);font-size:clamp(1.4rem,4.2vw,2.9rem);color:var(--ink);transition:transform .12s ease,background .12s}
.tile:hover{background:var(--orange-pale-hover);transform:translateY(-2px)}
.tile.used{background:var(--paper);border:2px dashed var(--line);color:var(--line);font-size:clamp(1rem,2.6vw,1.6rem)}
.tile.used:hover{color:var(--muted);transform:none}

/* scoreboard */
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.team{border:2px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.team input{font-family:var(--f-ui);font-weight:700;font-size:.95rem;letter-spacing:.03em;border:0;border-bottom:1px dashed var(--line);padding:2px 0;width:100%;color:var(--ink);background:var(--paper)}
.team input:focus{outline:none;border-bottom-color:var(--blue)}
.score{font-family:var(--f-display);font-size:clamp(1.8rem,4vw,2.6rem);line-height:1;font-variant-numeric:tabular-nums}
.score.neg{color:var(--orange-ink)}
.adj{display:flex;gap:6px}
.adj button{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:8px;font-family:var(--f-ui);font-weight:700;font-size:.78rem;padding:4px 0}
.adj button:hover{background:var(--tint)}
.team.lead{border-color:var(--blue);background:var(--blue-soft)}
.bottom{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.tc{display:flex;align-items:center;gap:8px;font-family:var(--f-ui);font-weight:700;font-size:.85rem}
.tc button{width:34px;height:34px;border-radius:8px;border:2px solid var(--blue);background:var(--paper);color:var(--blue-ink);font-weight:700}

/* clue overlay */
.over{position:fixed;inset:0;background:var(--paper);z-index:20;overflow-y:auto;
  padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(24px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.chead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--blue);padding-bottom:10px}
.chead .cname{font-family:var(--f-ui);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.9rem;color:var(--blue-ink);margin-right:auto}
.chead .val{font-family:var(--f-display);font-size:2rem;line-height:1}
.clue{font-size:clamp(1.3rem,2.9vw,2.1rem);line-height:1.35;margin:0;text-wrap:pretty;max-width:42ch}
.clue b{font-family:var(--f-ui)}
.fig{display:flex;justify-content:center;overflow-x:auto}
.fig svg{width:100%;max-width:680px;height:auto}
.timer{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tbar{flex:1 1 200px;height:12px;background:var(--tint);border-radius:6px;overflow:hidden;min-width:120px}
.tbar i{display:block;height:100%;background:var(--blue);width:100%;transition:width 1s linear}
.tbar.low i{background:var(--orange)}
.tnum{font-family:var(--f-display);font-size:1.8rem;min-width:2.2em;text-align:right;font-variant-numeric:tabular-nums}
.ans{border-left:6px solid var(--blue);background:var(--blue-soft);border-radius:10px;padding:14px 18px;display:flex;flex-direction:column;gap:6px}
.ans .a{font-family:var(--f-ui);font-weight:700;font-size:clamp(1.2rem,2.6vw,1.8rem);line-height:1.3}
.ans .w{font-size:clamp(1rem,1.9vw,1.25rem);line-height:1.45}
.award{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.aw{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:8px;min-width:0}
.aw .nm{font-family:var(--f-ui);font-weight:700;font-size:.9rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aw button{border:2px solid var(--line);background:var(--paper);border-radius:8px;font-family:var(--f-ui);font-weight:700;font-size:.8rem;padding:6px 8px;white-space:nowrap}
.aw button.ok.on{background:var(--blue);border-color:var(--blue);color:var(--ink)}
.aw button.no.on{background:var(--orange);border-color:var(--orange);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dd{font-family:var(--f-display);font-size:clamp(3rem,10vw,6rem);color:var(--orange);line-height:1;text-align:center;margin:20px 0 0}
.wager{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.pick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pick button{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 14px;font-family:var(--f-ui);font-weight:700}
.pick button.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue-ink)}
.num{font-family:var(--f-ui);font-weight:700;font-size:1.2rem;width:7em;text-align:center;padding:8px;border:2px solid var(--line);border-radius:10px;color:var(--ink);background:var(--paper)}
.num:focus{border-color:var(--blue);outline:none}
.fw{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;width:100%}
.fw label{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;font-family:var(--f-ui);font-weight:700;font-size:.9rem;text-align:left}
.fw small{font-family:var(--f-body);font-weight:400;color:var(--muted)}
.fw .num{width:100%}

/* charts */
.ch .gl{stroke:#ece8e3;stroke-width:1}
.ch .ax{stroke:var(--ink);stroke-width:1.5}
.ch .tk{fill:var(--muted);font:13px var(--f-body)}
.ch .lab{fill:var(--ink);font:700 14px var(--f-ui)}
.ch .bar{fill:var(--blue);stroke:var(--ink);stroke-width:1}
.ch .bar.b2{fill:var(--DeterminedGray)}
.ch .cnt{fill:var(--ink);font:700 13px var(--f-ui)}
.ch .box{fill:var(--blue-soft);stroke:var(--ink);stroke-width:2}
.ch .box.b2{fill:var(--orange-soft)}
.ch .wk{stroke:var(--ink);stroke-width:2}
.ch .md{stroke:var(--ink);stroke-width:3.5}
.ch .out{fill:var(--orange);stroke:var(--ink);stroke-width:1.5}
.ch .vl{fill:var(--muted);font:12px var(--f-body)}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile:hover{transform:none}.tbar i{transition:none}}
@media (max-width:560px){.board{gap:5px}.cat{min-height:56px;padding:6px 3px}.team{padding:8px}}
/* ---------- live additions ---------- */
.joinpill{display:flex;align-items:center;gap:10px;border:2px solid var(--blue);border-radius:12px;padding:6px 12px;font-family:var(--f-ui);font-weight:700}
.joinpill .k{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1.15}
.joinpill .c{font-family:var(--f-display);font-weight:400;font-size:1.7rem;letter-spacing:.08em;color:var(--blue-ink);line-height:1}
.joinpill .u{font-family:var(--f-body);font-weight:400;font-size:.8rem;color:var(--muted);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.net{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-ui);font-weight:700;font-size:.78rem;color:var(--muted)}
.net::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--line)}
.net.up::before{background:#2e9d5b}.net.wait::before{background:var(--orange)}.net.down::before{background:#c0392b}
.net.down{color:#a33}

/* lobby */
.lobby{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.lobby{grid-template-columns:1fr}}
.joinbig{border:3px solid var(--blue);border-radius:16px;padding:20px;text-align:center;display:flex;flex-direction:column;gap:6px;background:var(--blue-soft)}
.kicker{font-family:var(--f-ui);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.85rem;color:var(--blue-ink);margin:8px 0 0}
.url{font-family:var(--f-ui);font-weight:700;font-size:clamp(1rem,2.4vw,1.6rem);margin:0;word-break:break-all}
.bigcode{font-family:var(--f-display);font-size:clamp(4rem,12vw,8rem);line-height:1;letter-spacing:.1em;margin:0;color:var(--ink)}
.roster h2{font-family:var(--f-ui);font-size:1.2rem;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--blue);background:var(--paper);border-radius:999px;padding:6px 14px;font-family:var(--f-ui);font-weight:700;font-size:1rem}
.chip.off{border-style:dashed;border-color:var(--line);color:var(--muted)}
.chip.ok{background:var(--blue-soft)}
.empty{color:var(--muted);font-style:italic;margin:0}

/* buzz queue */
.queue{display:flex;flex-direction:column;gap:8px}
.qrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;flex-wrap:wrap}
.qrow .pos{font-family:var(--f-display);font-size:1.6rem;width:1.6em;text-align:center;line-height:1}
.qrow .nm{font-family:var(--f-ui);font-weight:700;font-size:clamp(1.05rem,2vw,1.4rem);flex:1;min-width:120px}
.qrow.now{border:3px solid var(--orange);background:var(--orange-soft)}
.qrow .tag{font-family:var(--f-ui);font-weight:700;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--orange-ink)}
.qrow button{border:2px solid var(--line);background:var(--paper);border-radius:8px;font-family:var(--f-ui);font-weight:700;font-size:.85rem;padding:6px 10px}
.qrow button.ok.on{background:var(--blue);border-color:var(--blue)}
.qrow button.no.on{background:var(--orange);border-color:var(--orange)}
.qrow .fa{flex-basis:100%;font-size:1.05rem;padding-left:calc(1.6em + 10px)}
.qrow .fa.none{color:var(--muted);font-style:italic}
.waiting{font-family:var(--f-ui);font-weight:700;color:var(--muted);margin:0}
.count{font-family:var(--f-display);font-size:clamp(2rem,5vw,3.2rem);margin:0;text-align:center}

/* top 3 footer */
.top3{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--ink);color:#fff;display:flex;align-items:stretch;gap:10px;
  padding:10px max(16px,env(safe-area-inset-left,0px)) max(10px,env(safe-area-inset-bottom,0px))}
.top3 .tl{font-family:var(--f-ui);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem;align-self:center;color:var(--DeterminedGray);writing-mode:horizontal-tb;min-width:4.5em;line-height:1.2}
.slot{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border-radius:10px;padding:6px 12px;background:#2b3945}
.slot .md{font-family:var(--f-display);font-size:1.7rem;width:1.5em;height:1.5em;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none;line-height:1}
.slot.r1 .md{background:#f2c94c}.slot.r2 .md{background:#d5d9de}.slot.r3 .md{background:#d79a62}
.slot .nm{font-family:var(--f-ui);font-weight:700;font-size:clamp(1rem,2.2vw,1.5rem);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .sc{font-family:var(--f-display);font-size:clamp(1.3rem,2.8vw,2rem);font-variant-numeric:tabular-nums}
.slot.blank .nm,.slot.blank .sc{color:#8795a1}
body.host .wrap{padding-bottom:110px}
body.host .over{padding-bottom:110px}
body.host .fig svg{max-height:46vh}
@media (max-width:640px){.top3 .tl{display:none}.slot{padding:6px 8px;gap:6px}.slot .md{font-size:1.2rem}}

/* players panel */
.pan{position:fixed;inset:0;z-index:30;background:rgba(31,42,51,.45);display:grid;place-items:start center;overflow-y:auto;padding:24px 16px 120px}
.pbox{background:var(--paper);border-radius:14px;width:min(720px,100%);padding:18px;display:flex;flex-direction:column;gap:12px}
.pbox h2{font-family:var(--f-ui);margin:0;font-size:1.2rem;margin-right:auto}
.prow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:8px 0;flex-wrap:wrap}
.prow .rk{font-family:var(--f-ui);font-weight:700;color:var(--muted);width:2em}
.prow .nm{font-family:var(--f-ui);font-weight:700;flex:1;min-width:110px}
.prow .sc{font-family:var(--f-display);font-size:1.4rem;min-width:3.5em;text-align:right}
.prow button{border:1px solid var(--line);background:var(--paper);border-radius:8px;font-family:var(--f-ui);font-weight:700;font-size:.78rem;padding:5px 9px}
.prow button.arm{background:var(--orange);border-color:var(--orange)}
.dot{width:10px;height:10px;border-radius:50%;background:#2e9d5b;flex:none}.dot.off{background:var(--line)}

/* final standings */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin-top:10px}
.pod{display:flex;flex-direction:column;align-items:center;gap:8px;width:min(30%,220px)}
.pod .nm{font-family:var(--f-ui);font-weight:700;font-size:clamp(1rem,2.6vw,1.8rem);text-align:center;word-break:break-word}
.pod .sc{font-family:var(--f-display);font-size:clamp(1.3rem,3vw,2.2rem)}
.pod .blk{width:100%;border-radius:12px 12px 0 0;display:grid;place-items:center;font-family:var(--f-display);font-size:clamp(2.4rem,6vw,4rem);color:var(--ink)}
.pod.p1 .blk{height:200px;background:#f2c94c}.pod.p2 .blk{height:150px;background:#d5d9de}.pod.p3 .blk{height:110px;background:#d79a62}

/* ---------- student device ---------- */
body.player{background:var(--paper)}
.pl{max-width:520px;margin:0 auto;padding:16px 0 32px;display:flex;flex-direction:column;gap:16px;min-height:100svh}
.pl h1{font-size:clamp(1.8rem,8vw,2.4rem);text-align:center;margin:8px 0 0}
.pl form{display:flex;flex-direction:column;gap:12px}
.pl label{font-family:var(--f-ui);font-weight:700;display:flex;flex-direction:column;gap:6px}
.pl input[type=text],.pl textarea,.pl .num{font-family:var(--f-ui);font-weight:700;font-size:1.3rem;padding:12px;border:2px solid var(--line);border-radius:12px;width:100%;color:var(--ink);background:var(--paper)}
.pl textarea{font-family:var(--f-body);font-weight:400;font-size:1.1rem;min-height:120px;resize:vertical}
.pl input:focus,.pl textarea:focus{border-color:var(--blue);outline:none}
.pl .codein{text-transform:uppercase;letter-spacing:.3em;text-align:center;font-size:1.8rem}
.pl .btn{font-size:1.1rem;padding:14px}
.err{background:var(--orange-soft);border-left:6px solid var(--orange);border-radius:10px;padding:10px 14px;margin:0;font-weight:700}
.me{display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--blue);padding-bottom:10px}
.me .nm{font-family:var(--f-ui);font-weight:700;font-size:1.2rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .sc{font-family:var(--f-display);font-size:2rem;line-height:1}
.me .rk{font-family:var(--f-ui);font-weight:700;font-size:.8rem;color:var(--muted);text-align:right;line-height:1.2}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.stage .scat{font-family:var(--f-ui);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue-ink);margin:0}
.stage .msg{font-family:var(--f-ui);font-weight:700;font-size:clamp(1.3rem,6vw,1.8rem);margin:0;line-height:1.25}
.stage .sub{color:var(--muted);margin:0;font-size:1.05rem}
.buzz{width:min(72vw,300px);aspect-ratio:1;border-radius:50%;border:0;background:var(--orange);color:var(--ink);font-family:var(--f-display);font-size:clamp(3rem,16vw,4.6rem);

.big{font-family:var(--f-display);font-size:clamp(3.5rem,18vw,5.5rem);line-height:1;margin:0}
.big.good{color:var(--blue-ink)}.big.bad{color:var(--orange-ink)}
.pl .stage form{width:100%}
.foot{text-align:center;font-size:.85rem;color:var(--muted)}

/* ---------- multiple choice ---------- */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.opt .lt{font-family:var(--f-display);font-size:1.8rem;width:1.5em;height:1.5em;border-radius:10px;background:var(--blue);display:grid;place-items:center;flex:none;line-height:1;position:relative;z-index:1}
.opt .tx{font-family:var(--f-ui);font-weight:700;font-size:clamp(1rem,1.9vw,1.35rem);line-height:1.25;flex:1;position:relative;z-index:1}
.opt .ct{font-family:var(--f-ui);font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.opt .bar{position:absolute;left:0;top:0;bottom:0;background:var(--tint);z-index:0}
.opt.right{border:3px solid var(--blue-ink);background:var(--blue-soft)}
.opt.right .bar{background:rgba(75,156,211,.28)}
.opt.wrong{opacity:.6}
.opt.wrong .lt{background:var(--DeterminedGray)}
.opt-set{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;max-width:760px}
.opt-set input{width:20px;height:20px;margin-top:2px;flex:none}
.choices{display:flex;flex-direction:column;gap:10px;width:100%}
.choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:3px solid var(--line);background:var(--paper);border-radius:14px;padding:12px;min-height:64px;touch-action:manipulation}
.choice .lt{font-family:var(--f-display);font-size:1.8rem;width:1.5em;height:1.5em;border-radius:10px;background:var(--blue-soft);display:grid;place-items:center;flex:none;line-height:1}
.choice .tx{font-family:var(--f-ui);font-weight:700;font-size:1.05rem;line-height:1.3}
.choice.on{border-color:var(--orange);background:var(--orange-soft)}
.choice.on .lt{background:var(--orange)}
.choice:disabled{opacity:.6;cursor:default}
.choice:disabled.on{opacity:1}
body.host .over .fig svg{max-height:38vh}

/* ---------- math + linear figures ---------- */
.m{font-family:"Times New Roman",Times,serif;white-space:nowrap;font-size:1.1em}
.m i{font-style:italic}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.78em;line-height:1.1;margin:0 .1em}
.frac span:first-child{border-bottom:1.5px solid currentColor;padding:0 .15em}
.fig svg.sq{max-width:440px}
.ch .ln{stroke:var(--blue-ink);stroke-width:3.5;fill:none;stroke-linecap:round}
.ch .ln.b2{stroke:var(--orange)}
.ch .fl{fill:var(--blue-ink);font:italic 700 19px "Times New Roman",Times,serif}
.ch .fl.b2{fill:var(--orange-ink)}
.ch .pt{fill:var(--ink);stroke:var(--paper);stroke-width:2}
.vt{border-collapse:collapse;font-family:var(--f-ui);font-weight:700;font-size:clamp(1.1rem,2.4vw,1.6rem);font-variant-numeric:tabular-nums;margin:0 auto}
.vt th,.vt td{border:2px solid var(--line);padding:8px 18px;text-align:center}
.vt th{background:var(--blue-soft);color:var(--blue-ink)}
.std{font-family:var(--f-ui);font-weight:700;font-size:.72rem;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.accb{position:relative;z-index:1;border:2px solid var(--blue);background:var(--paper);color:var(--blue-ink);border-radius:8px;font-family:var(--f-ui);font-weight:700;font-size:.78rem;padding:5px 9px;white-space:nowrap}
.opt.wrong:has(.accb){opacity:.8}
.oa{display:flex;flex-direction:column;gap:6px;width:100%}

<body>
<div class="wrap" id="app"></div>
<div class="over" id="over" hidden=""></div>
<div class="pan" id="pan" hidden=""></div>
<footer class="top3" id="top3" aria-label="Top three scores" hidden=""></footer>
<script>
/* ---------- math text: [[...]] = math, {{a|b}} = fraction ---------- */
const M=s=>String(s??'').replace(/\[\[(.+?)\]\]/g,(_,e)=>'<span class="m">'+e.replace(/-/g,'−').replace(/[A-Za-z]/g,'<i>$&</i>').replace(/\{\{(.+?)\|(.+?)\}\}/g,'<span class="frac"><span>$1</span><span>$2</span></span>')+'</span>');
const PLAIN=s=>String(s??'').replace(/\[\[(.+?)\]\]/g,(_,e)=>e.replace(/-/g,'−').replace(/\{\{(.+?)\|(.+?)\}\}/g,'$1/$2')).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();

/* ---------- coordinate-plane figures ---------- */
function plane(o){
  const W=o.w||420,H=o.h||420,L=o.q1?62:16,R=16,T=16,B=o.q1?56:16;
  const X=x=>+(L+(x-o.x0)/(o.x1-o.x0)*(W-L-R)).toFixed(1),Y=y=>+(T+(o.y1-y)/(o.y1-o.y0)*(H-T-B)).toFixed(1);
  const id='cp'+Math.random().toString(36).slice(2,8),tl=n=>(n<0?'−':'')+Math.abs(n);
  let s=`<defs><clipPath id="${id}"><rect x="${X(o.x0)}" y="${Y(o.y1)}" width="${X(o.x1)-X(o.x0)}" height="${Y(o.y0)-Y(o.y1)}"/></clipPath></defs>`;
  for(let x=o.x0;x<=o.x1+1e-9;x+=o.xs)s+=`<line class="gl" x1="${X(x)}" x2="${X(x)}" y1="${Y(o.y0)}" y2="${Y(o.y1)}"/>`;
  for(let y=o.y0;y<=o.y1+1e-9;y+=o.ys)s+=`<line class="gl" x1="${X(o.x0)}" x2="${X(o.x1)}" y1="${Y(y)}" y2="${Y(y)}"/>`;
  const ax=o.q1?o.x0:0,ay=o.q1?o.y0:0;
  s+=`<line class="ax" x1="${X(o.x0)}" x2="${X(o.x1)}" y1="${Y(ay)}" y2="${Y(ay)}"/><line class="ax" x1="${X(ax)}" x2="${X(ax)}" y1="${Y(o.y0)}" y2="${Y(o.y1)}"/>`;
  const lx=o.lx||o.xs,ly=o.ly||o.ys;
  for(let x=o.x0;x<=o.x1+1e-9;x+=lx){if(!o.q1&&x===0)continue;s+=`<text class="tk" x="${X(x)}" y="${Y(ay)+18}" text-anchor="middle">${tl(x)}</text>`;}
  for(let y=o.y0;y<=o.y1+1e-9;y+=ly){if(y===0&&!o.q1)continue;if(o.q1&&y===o.y0)continue;s+=`<text class="tk" x="${X(ax)-7}" y="${Y(y)+4}" text-anchor="end">${tl(y)}</text>`;}
  if(!o.q1)s+=`<text class="tk" x="${X(0)-6}" y="${Y(0)+17}" text-anchor="end">0</text>`;
  if(o.xt)s+=`<text class="lab" x="${(X(o.x0)+X(o.x1))/2}" y="${H-8}" text-anchor="middle">${o.xt}</text>`;
  if(o.yt)s+=`<text class="lab" transform="translate(16 ${(Y(o.y0)+Y(o.y1))/2}) rotate(-90)" text-anchor="middle">${o.yt}</text>`;
  (o.lines||[]).forEach(l=>{const a=l.a??o.x0,b=l.b??o.x1;
    s+=`<line clip-path="url(#${id})" class="ln ${l.c||''}" x1="${X(a)}" y1="${Y(l.m*a+l.k)}" x2="${X(b)}" y2="${Y(l.m*b+l.k)}"/>`;
    if(l.lab)s+=`<text class="fl ${l.c||''}" x="${X(l.lx)}" y="${Y(l.ly)}">${l.lab}</text>`;});
  (o.pts||[]).forEach(p=>s+=`<circle class="pt" cx="${X(p[0])}" cy="${Y(p[1])}" r="6"/>`);
  return `<svg class="ch${o.q1?'':' sq'}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.alt}">${s}</svg>`;
}
const G_INT=()=>plane({x0:-1,x1:7,y0:-1,y1:11,xs:1,ys:1,w:380,h:500,alt:'Two lines that cross at the point (2, 5)',lines:[{m:1,k:3,lab:'f(x)',lx:4.3,ly:8.7},{m:-2,k:9,c:'b2',lab:'g(x)',lx:4.4,ly:2.3}],pts:[[2,5]]});
const G_YINT=()=>plane({x0:-8,x1:8,y0:-8,y1:8,xs:1,ys:1,lx:2,ly:2,alt:'A line falling from upper left to lower right',lines:[{m:-2,k:6}]});
const G_XINT=()=>plane({x0:-8,x1:8,y0:-8,y1:8,xs:1,ys:1,lx:2,ly:2,alt:'A line rising from lower left to upper right',lines:[{m:2,k:-4}]});
const G_BATT=()=>plane({q1:true,x0:0,x1:10,y0:0,y1:100,xs:1,ys:10,ly:20,w:640,h:360,xt:'Hours streaming',yt:'Battery (%)',alt:'Battery starts at 100 percent and falls in a straight line to 0 percent at 8 hours',lines:[{m:-12.5,k:100,a:0,b:8}],pts:[[0,100],[8,0]]});
const T_SYS=()=>`<div style="overflow-x:auto"><table class="vt"><tr><th>${M('[[x]]')}</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td></tr><tr><th>${M('[[f(x)]]')}</th><td>1</td><td>4</td><td>7</td><td>10</td><td>13</td></tr><tr><th>${M('[[g(x)]]')}</th><td>9</td><td>8</td><td>7</td><td>6</td><td>5</td></tr></table></div>`;

/* ---------- content ----------
   Multiple choice: o = options (plain text shown on devices), c = index of the correct option.
   Open response:   a = answer shown on the board, ok = accepted typed answers (spaces, "x =", "$" and parentheses are ignored). */
const VALUES=[100,200,300,400,500];
const CATS=[
{name:'Solve It',clues:[
 {std:'A-REI.3',q:'Solve for [[x]]: [[3x - 4 = 11]]',a:'[[x = 5]]',ok:['5'],w:'Add 4 to both sides: [[3x = 15]]. Divide by 3.'},
 {std:'A-REI.3',q:'Solve [[2(x + 3) = 14]]',o:['x = 4','x = 5.5','x = 8','x = 11'],c:0,w:'Distribute: [[2x + 6 = 14]], so [[2x = 8]] and [[x = 4]].'},
 {std:'A-REI.3',q:'Which is the solution to [[-2x + 5 > 13]]?',o:['x > −4','x < −4','x > −9','x < 9'],c:1,w:'Subtract 5: [[-2x > 8]]. Dividing by a negative number flips the inequality: [[x < -4]].'},
 {std:'A-REI.3',q:'Solve for [[x]]: [[5x - 7 = 2x + 8]]',a:'[[x = 5]]',ok:['5'],w:'Subtract [[2x]]: [[3x - 7 = 8]]. Add 7: [[3x = 15]].'},
 {std:'A-REI.3',q:'Solve [[4(x - 1) ≥ 2x + 6]]',o:['x ≥ 5','x ≤ 5','x ≥ 2.5','x ≥ 1'],c:0,w:'[[4x - 4 ≥ 2x + 6]], so [[2x ≥ 10]] and [[x ≥ 5]].'}
]},
{name:'Systems',clues:[
 {std:'A-REI.6',q:'Which point is the solution to the system [[y = x + 2]] and [[y = 3x]]?',o:['(1, 3)','(3, 1)','(2, 4)','(0, 2)'],c:0,w:'Set them equal: [[x + 2 = 3x]], so [[x = 1]] and [[y = 3]]. The point checks in both equations.'},
 {std:'A-REI.6',q:'[[x + y = 10]]<br>[[x - y = 4]]<br>What is the value of [[x]]?',a:'[[x = 7]]',ok:['7'],w:'Add the equations: [[2x = 14]]. (Then [[y = 3]].)'},
 {std:'A-REI.5',q:'[[2x + y = 7]]<br>[[x - y = 2]]<br>Adding the two equations gives which new equation?',o:['3x = 9','x + 2y = 5','3x + 2y = 9','x = 5'],c:0,w:'The [[y]]-terms cancel. Replacing an equation with this sum keeps the same solution, (3, 1).'},
 {std:'A-REI.11',q:'The graphs of [[f(x)]] and [[g(x)]] are shown. What is the solution to [[f(x) = g(x)]]?',fig:G_INT,o:['x = 2','x = 5','x = 3','x = 9'],c:0,w:'The lines cross at (2, 5). The [[x]]-value of the intersection solves [[f(x) = g(x)]].'},
 {std:'A-REI.11',q:'Use the table. For what value of [[x]] does [[f(x) = g(x)]]?',fig:T_SYS,a:'[[x = 2]]',ok:['2'],w:'At [[x = 2]], both [[f(2)]] and [[g(2)]] equal 7.'}
]},
{name:'Read the Graph',clues:[
 {std:'A-REI.10',q:'Which point lies on the graph of [[y = 3x + 1]]?',o:['(2, 7)','(3, 7)','(1, 3)','(0, 3)'],c:0,w:'[[3(2) + 1 = 7]]. Every point on the line makes the equation true.'},
 {std:'F-IF.4',q:'What is the [[y]]-intercept of the line?',fig:G_YINT,a:'6, the point (0, 6)',ok:['6','(0,6)','0,6'],w:'The line crosses the [[y]]-axis at (0, 6).'},

/* multiple-choice lookup, built from the clues above */
const MC={};CATS.forEach((c,ci)=>c.clues.forEach((q,r)=>{if(q.o)MC[ci+'-'+r]={o:q.o,c:q.c};}));
const isOpen=k=>!MC[k];
/* typed-answer checking */
const norm=s=>String(s??'').toLowerCase().replace(/[−–—]/g,'-').replace(/\s+/g,'').replace(/^\$/,'').replace(/^[a-z]=(?=[-.\d(])/,'').replace(/^\((.*)\)$/,'$1').replace(/\.$/,'');
const numOf=s=>{if(/^-?\d*\.?\d+$/.test(s))return parseFloat(s);const f=s.match(/^(-?\d+)\/(\d+)$/);return f&&+f[2]?f[1]/f[2]:null;};
const sameAns=(a,b)=>{if(a===b)return true;const x=numOf(a),y=numOf(b);return x!=null&&y!=null&&Math.abs(x-y)<1e-9;};
function okList(k){return (k==='final'?FINAL:clueData(k).clue).ok||[];}
function isRight(k,a){
  if(a==null)return false;
  if(!isOpen(k))return a===MC[k].c;
  const n=norm(a);
  return okList(k).some(x=>sameAns(norm(x),n))||((H&&H.acc&&H.acc[k])||[]).includes(n);
}

const DB=(()=>{
  if(FIREBASE_CONFIG.databaseURL&&typeof firebase!=='undefined'){
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      const f=firebase.database();
      return {mode:'live',
        set:(p,v)=>f.ref(p).set(v),
        remove:p=>f.ref(p).remove(),
        once:p=>f.ref(p).once('value').then(s=>s.val()),
        on:(p,cb)=>{const r=f.ref(p);const h=r.on('value',s=>cb(s.val()),()=>{});return ()=>r.off('value',h);},
        presence:p=>{f.ref('.info/connected').on('value',s=>{if(s.val()===true){f.ref(p).onDisconnect().set(false);f.ref(p).set(true);}});},
        connected:cb=>{f.ref('.info/connected').on('value',s=>cb(!!s.val()));}};
    }catch(e){}
  }
  const K='math1-linear-jeopardy-practice-db',subs=new Set();
  const read=()=>{try{return JSON.parse(localStorage.getItem(K)||'{}')||{};}catch(e){return {};}};
  const at=(o,p)=>p.split('/').filter(Boolean).reduce((a,k)=>a==null?null:(a[k]??null),o);
  const fire=()=>{const root=read();subs.forEach(s=>{const v=at(root,s.p),j=JSON.stringify(v);if(j!==s.last){s.last=j;s.cb(v);}});};
  const put=(p,v)=>{const root=read(),ks=p.split('/').filter(Boolean);let o=root;
    for(let i=0;i<ks.length-1;i++){if(typeof o[ks[i]]!=='object'||o[ks[i]]===null)o[ks[i]]={};o=o[ks[i]];}
    if(v==null)delete o[ks[ks.length-1]];else o[ks[ks.length-1]]=JSON.parse(JSON.stringify(v));
    try{localStorage.setItem(K,JSON.stringify(root));}catch(e){}setTimeout(fire,0);};
  addEventListener('storage',e=>{if(e.key===K)fire();});
  return {mode:'local',
    set:(p,v)=>{put(p,v);return Promise.resolve();},
    remove:p=>{put(p,null);return Promise.resolve();},
    once:p=>Promise.resolve(at(read(),p)),
    on:(p,cb)=>{const s={p,cb,last:undefined};subs.add(s);setTimeout(()=>{const v=at(read(),p);s.last=JSON.stringify(v);cb(v);},0);return ()=>subs.delete(s);},
    presence:p=>{put(p,true);addEventListener('pagehide',()=>put(p,false));},
    connected:cb=>cb(true)};
})();

async function freeCode(){let code;for(let i=0;i<12;i++){code=newCode();if(!(await DB.once(`sessions/${code}/app`)))break;}return code;}
async function openSession(){
  const app=await DB.once(`${base()}/app`);
  if(app!==APP)await DB.set(base(),{app:APP,created:Date.now(),state:{phase:H.phase}});
  DB.connected(ok=>{net=ok?{s:'up',m:DB.mode==='local'?'Practice mode':'Live'}:{s:'wait',m:'Reconnecting…'};const n=$('net');if(n){n.className='net '+net.s;n.textContent=net.m;}});
  watch('players',`${base()}/players`,v=>{
    v=v||{};const ids=Object.keys(v).filter(cid=>v[cid]&&v[cid].name);
    H.players={};ids.forEach(cid=>H.players[cid]={name:cleanName(v[cid].name)||'Player',on:v[cid].on!==false});
    const known=H.order.filter(c=>H.players[c]);
    ids.filter(c=>!known.includes(c)).sort((a,b)=>(v[a].t||0)-(v[b].t||0)).forEach(c=>known.push(c));
    H.order=known;save();publish();liveChanged();
  });

}
function watchCur(){
  const k=H.cur;
  if(!k){watch('ans',null);watch('wag',null);return;}
  watch('ans',`${base()}/answers/${k}`,v=>{
    if(H.cur!==k||H.stage!=='clue'||H.locked)return;
    const a={};Object.entries(v||{}).forEach(([cid,i])=>{if(!H.players[cid])return;if(isOpen(k)){const t=String(i??'').trim().slice(0,30);if(t)a[cid]=t;}else{i=Math.round(+i);if(i>=0&&i<4)a[cid]=i;}});
    H.ans[k]=a;save();renderClue();
  });
  watch('wag',`${base()}/wagers/${k}`,v=>{
    if(H.cur!==k||H.stage!=='wager')return;
    const w={};Object.entries(v||{}).forEach(([cid,x])=>{x=Math.round(+x);if(H.players[cid]&&isFinite(x))w[cid]=Math.min(Math.max(x,0),maxWager(cid,k));});
    H.wag[k]=w;save();renderClue();
  });
}

function publish(){
  const k=H.cur,st={phase:H.phase,ts:Date.now()};
  if(k){
    const {c,v}=clueData(k);
    Object.assign(st,{cur:k,stage:H.stage,locked:!!H.locked,cat:k==='final'?FINAL.cat:c.name},isOpen(k)?{open:true}:{opts:MC[k].o});
    if(v)st.val=v;
    if(k==='final')st.kind='Final Jeopardy';else if(k===H.dd)st.kind='Daily Double';
    if(H.stage==='wager'){st.maxw={};pids().forEach(cid=>st.maxw[cid]=maxWager(cid,k));}
    if(H.stage==='clue'&&isWagerClue(k)){st.wg={};pids().forEach(cid=>st.wg[cid]=+(H.wag[k]||{})[cid]||0);}
    if(H.stage==='reveal'){if(isOpen(k)){st.ap=PLAIN(clueData(k).clue.a);st.ok={};pids().forEach(cid=>{if(isRight(k,(H.ans[k]||{})[cid]))st.ok[cid]=true;});}else st.right=MC[k].c;st.res={};H.log.filter(x=>x.k===k).forEach(x=>st.res[x.cid]=x.d);}
  }
  const sc={};pids().forEach(cid=>sc[cid]=score(cid));
  DB.set(`${base()}/state`,st).catch(()=>{});
  DB.set(`${base()}/scores`,sc).catch(()=>{});
}

function scoreClue(){
  const k=H.cur,{v}=clueData(k),ans=H.ans[k]||{},wag=H.wag[k]||{},wc=isWagerClue(k);
  H.log=H.log.filter(x=>x.k!==k);

  if(H.stage==='wager'){
    const wag=H.wag[k]||{},inN=ps.filter(cid=>wag[cid]!=null).length;
    h+=`<p class="dd"${isFin?' style="color:var(--blue-ink)"':''}>${isFin?'Final Jeopardy':'Daily Double!'}</p><div class="wager"><p class="clue" style="max-width:none;text-align:center">Category: <b>${esc(c.name)}</b></p>
     <p class="note" style="font-size:1.15rem">${isDD?'Everyone plays this one! On your device, wager from 0 up to your score, or up to 500 if your score is lower.':'On your device, wager from 0 up to your score. If your score is 0 or less, you can only wager 0.'} A right answer wins your wager; a wrong answer loses it.</p>
     <p class="count">${inN} of ${ps.length} wagers in</p>${chipsFor(wag)}
     <button class="btn" data-act="showclue">Show the clue</button><p class="note">Anyone who hasn’t wagered when you show the clue plays for 0.</p></div></div>`;
    $over.innerHTML=h;return;
  }
  h+=`<p class="clue">${M(clue.q)}</p>`;
  if(clue.fig)h+=`<div class="fig">${clue.fig()}</div>`;
  const ans=H.ans[k]||{},rev=H.stage==='reveal';
  const op=isOpen(k);const counts=[0,0,0,0];if(!op)Object.keys(ans).forEach(cid=>{if(H.players[cid])counts[ans[cid]]++;});
  const tot=counts.reduce((a,b)=>a+b,0);
  h+=op?(rev?openGroups(k,ans):`<p class="note" style="font-size:1.15rem"><b>Open response.</b> Students type their answer on their device.</p>`):`<div class="opts${rev?' rev':''}">${m.o.map((o,i)=>`<div class="opt${rev?(i===m.c?' right':' wrong'):''}"><span class="lt">${LET[i]}</span><span class="tx">${esc(o)}</span>${rev?`<span class="ct">${counts[i]}</span><i class="bar" style="width:${tot?counts[i]/tot*100:0}%"></i>`:''}</div>`).join('')}</div>`;
  if(!rev){
    const inN=ps.filter(cid=>ans[cid]!=null).length;
    h+=timerHTML();
    h+=`<p class="count">${inN} of ${ps.length} answered${H.locked?' · answers locked':''}</p>${chipsFor(ans)}
     <div class="row" style="justify-content:center"><button class="btn" data-act="reveal">Show answer</button>${H.locked?`<button class="btn ghost" data-act="unlock">Reopen answers</button>`:`<button class="btn ghost" data-act="lock">Lock answers</button>`}</div>`;
  }else{
    const right=ps.filter(cid=>isRight(k,ans[cid]));
    h+=`<div class="ans"><span class="a">${op?M(clue.a):LET[m.c]+'. '+esc(m.o[m.c])}</span><span class="w">${M(clue.w)}</span></div>
     <p class="count">${right.length} of ${ps.length} got it right</p>
     <div class="chips" style="justify-content:center">${right.map(cid=>{const e=H.log.find(x=>x.k===k&&x.cid===cid);return `<span class="chip ok">${esc(pname(cid))}${isWagerClue(k)&&e?' +'+fmt(e.d):''}</span>`;}).join('')}</div>
     <div class="row" style="justify-content:center">${isFin?`<button class="btn" data-act="standings">Show final standings</button>`:`<button class="btn dark" data-act="close">Back to board</button>`}</div>`;
  }
  $over.innerHTML=h+'</div>';
}
function openGroups(k,ans){
  const g={};Object.keys(ans).forEach(cid=>{if(!H.players[cid])return;const raw=ans[cid],n=norm(raw);(g[n]=g[n]||{raw,n,c:0}).c++;});
  const list=Object.values(g).sort((a,b)=>isRight(k,b.raw)-isRight(k,a.raw)||b.c-a.c),tot=list.reduce((a,x)=>a+x.c,0);
  if(!list.length)return `<p class="note">No answers were submitted.</p>`;
  return `<p class="note">Typed answers. Tap <b>Count as correct</b> to accept an answer written a different way.</p><div class="opts rev">${list.map(x=>{const ok=isRight(k,x.raw);return `<div class="opt ${ok?'right':'wrong'}"><span class="tx">${esc(x.raw)}</span>${ok?'':`<button class="accb" data-accept="${esc(x.n)}">Count as correct</button>`}<span class="ct">${x.c}</span><i class="bar" style="width:${x.c/tot*100}%"></i></div>`;}).join('')}</div>`;
}
function renderOver(){
  const r=ranked(),order=[1,0,2];
  $over.innerHTML=`<div class="card"><div class="chead"><span class="cname">Final standings</span><button class="btn dark" data-act="close">Back to board</button></div>
   <p class="dd" style="color:var(--blue-ink)">Final Scores</p>
   <div class="podium">${order.map(i=>{const p=r[i];return p?`<div class="pod p${i+1}"><span class="nm">${esc(p.name)}</span><span class="sc">${fmt(p.s)}</span><div class="blk">${i+1}</div></div>`:'';}).join('')}</div>
   <p class="note" style="text-align:center">Every student can see their own final score and rank on their device.</p></div>`;
}
function showOverlay(){$over.hidden=false;document.body.style.overflow='hidden';if(H.phase==='over'&&!H.cur)renderOver();else renderClue();$over.scrollTop=0;}
function openClue(k){
  H.cur=k;stopTimer();H.locked=false;
  if(k!=='final')H.used[k]=true;
  H.stage=H.rev[k]?'reveal':(isWagerClue(k)&&!H.shown[k]?'wager':'clue');
  watchCur();changed();showOverlay();
}
function closeClue(){H.cur=null;H.stage=null;H.locked=false;if(H.phase==='over')H.phase='board';stopTimer();watchCur();$over.hidden=true;document.body.style.overflow='';changed();renderBoard();}
function stopTimer(){clearInterval(timer);timer=null;}
function startTimer(){stopTimer();tMax=H.cur==='final'?60:30;tLeft=tMax;
  timer=setInterval(()=>{tLeft--;const f=$('tfill'),n=$('tnum');if(f){f.style.width=(tLeft/tMax*100)+'%';f.parentElement.classList.toggle('low',tLeft<=10);}if(n)n.textContent=Math.max(tLeft,0);
    if(tLeft<=0){stopTimer();H.locked=true;changed();renderClue();const n2=$('tnum');if(n2)n2.textContent='Time!';}},1000);
  renderClue();}
async function hostClick(e){
  const t=e.target.closest('[data-clue]');if(t)return openClue(t.dataset.clue);
  if(e.target===$pan){$pan.hidden=true;return;}
  const acc=e.target.closest('[data-accept]');if(acc&&H.cur){const k=H.cur;H.acc[k]=H.acc[k]||[];if(!H.acc[k].includes(acc.dataset.accept))H.acc[k].push(acc.dataset.accept);scoreClue();changed();return renderClue();}
  const adj=e.target.closest('[data-adj]');if(adj){H.log.push({k:'adj',cid:adj.dataset.adj,d:+adj.dataset.d});changed();return renderPan();}
  const rm=e.target.closest('[data-rm]');
  if(rm){const cid=rm.dataset.rm;if(rmArm!==cid){rmArm=cid;return renderPan();}
    rmArm=null;H.log=H.log.filter(x=>x.cid!==cid);delete H.players[cid];H.order=H.order.filter(x=>x!==cid);
    DB.remove(`${base()}/players/${cid}`);changed();renderPan();return liveChanged();}
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act;
  if(act!=='new'&&newArm){newArm=false;if(act!=='players')renderBoard();}
  if(act!=='newclass'&&classArm){classArm=false;}
  if(act==='close')return closeClue();
  if(act==='players'){rmArm=null;renderPan();$pan.hidden=false;return;}
  if(act==='panclose'){$pan.hidden=true;return;}
  if(act==='lobby'){$pan.hidden=true;if(H.cur)closeClue();H.phase='lobby';changed();return renderHost();}
  if(act==='start'){H.phase='board';changed();return renderHost();}
  if(act==='newclass'){if(!classArm){classArm=true;return renderLobby();}classArm=false;
    const old=base(),pen=H.penalty;
    DB.set(`${old}/state`,{phase:'ended'}).catch(()=>{});
    Object.keys(unsubs).forEach(k=>watch(k,null));
    try{H=blankH(await freeCode());H.penalty=pen;save();await openSession();}catch(err){}
    return renderHost();}
  if(act==='showclue'){H.shown[H.cur]=true;H.stage='clue';H.locked=false;changed();return renderClue();}
  if(act==='lock'){H.locked=true;changed();return renderClue();}
  if(act==='unlock'){H.locked=false;changed();return renderClue();}
  if(act==='reveal'){stopTimer();H.locked=true;H.stage='reveal';H.rev[H.cur]=true;scoreClue();changed();return renderClue();}
  if(act==='timer'){if(timer){stopTimer();return renderClue();}H.locked=false;changed();return startTimer();}
  if(act==='final')return openClue('final');
  if(act==='standings'){H.cur=null;H.stage=null;H.phase='over';stopTimer();watchCur();changed();renderBoard();return showOverlay();}
  if(act==='new'){if(!newArm){newArm=true;return renderBoard();}newArm=false;
    const keep={code:H.code,players:H.players,order:H.order,penalty:H.penalty};
    H=Object.assign(blankGame(),keep);
    DB.remove(`${base()}/answers`);DB.remove(`${base()}/wagers`);
    watchCur();changed();return renderBoard();}
}

/* ================= STUDENT (device) ================= */
const SKEY='math1-linear-jeopardy-player-v1';
let S={cid:'',name:'',code:'',active:false},sErr='',sBusy=false,lastKey='';
let sState=null,sScores={},sMine=null,sWag=null,sCur=null,sUnsubs={},joinedOnce=false;
function sSave(){LS.set(SKEY,S);}
function sWatch(key,path,cb){if(sUnsubs[key])sUnsubs[key]();sUnsubs[key]=path?DB.on(path,cb):null;}
function studentInit(){
  document.body.classList.add('player');
  const saved=LS.get(SKEY)||{};
  S.cid=saved.cid||rid();S.name=saved.name||'';
  const qc=(qs.get('code')||qs.get('join')||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
  S.code=qc||saved.code||'';
  S.active=!!saved.active&&(!qc||qc===saved.code);
  sSave();
  document.addEventListener('click',studentClick);
  document.addEventListener('submit',studentSubmit);
  renderStudent();
  if(S.active)sJoin(true);
}
async function sJoin(rejoin){
  sBusy=true;renderStudent();
  try{
    const sess=`sessions/${S.code}`;
    const app=await DB.once(`${sess}/app`),st=await DB.once(`${sess}/state`);
    if(app!==APP||!st||st.phase==='ended'){sErr=`No game found with code ${S.code}. Check the code on the board.`;return sStop(true);}
    const ps=await DB.once(`${sess}/players`)||{};
    if(!ps[S.cid]){
      if(rejoin){sErr='You were removed from this game. You can join again.';return sStop(true);}
      if(Object.values(ps).some(p=>p&&p.name&&p.name.toLowerCase()===S.name.toLowerCase())){sErr=`Someone already joined as ${S.name}. Add your last initial, like “${S.name} R”.`;return sStop(true);}
      if(Object.keys(ps).length>=60){sErr='This game is full.';return sStop(true);}
    }
    await DB.set(`${sess}/players/${S.cid}`,{name:S.name,t:ps[S.cid]&&ps[S.cid].t||Date.now(),on:true});
    DB.presence(`${sess}/players/${S.cid}/on`);
    S.active=true;sErr='';sSave();joinedOnce=true;
    sWatch('state',`${sess}/state`,v=>{
      sState=v;
      if(v&&v.phase==='ended'){sErr='Your teacher started a new class. Join again with the new code.';S.code='';return sStop(true);}
      const k=v&&v.cur||null;
      if(k!==sCur){sCur=k;sMine=null;sWag=null;
        sWatch('mine',k?`${sess}/answers/${k}/${S.cid}`:null,x=>{sMine=x==null?null:(typeof x==='string'?x:+x);renderStudent();});
        sWatch('wag',k?`${sess}/wagers/${k}/${S.cid}`:null,x=>{sWag=x==null?null:+x;renderStudent();});
      }
      renderStudent();
    });
    sWatch('scores',`${sess}/scores`,v=>{sScores=v||{};renderStudent();});
    sWatch('me',`${sess}/players/${S.cid}`,v=>{if(!v&&joinedOnce&&S.active){sErr='You were removed from this game. You can join again.';sStop(true);}});
  }catch(e){
    sErr='Could not reach the game. Check that you’re online, then try again.';sStop(true);
  }finally{sBusy=false;renderStudent();}
}
function sStop(keepErr){
  Object.keys(sUnsubs).forEach(k=>sWatch(k,null));
  S.active=false;sSave();sState=null;sScores={};sMine=null;sWag=null;sCur=null;joinedOnce=false;lastKey='';
  if(!keepErr)sErr='';
  renderStudent();
}
function compose(){
  const st=sState;if(!st)return null;
  const sc=sScores||{},my=+sc[S.cid]||0,vals=Object.values(sc).map(Number);
  const b={name:S.name,score:my,rank:1+vals.filter(x=>x>my).length,n:Math.max(vals.length,1)};
  if(st.phase==='lobby')return {...b,v:'lobby'};
  if(st.phase==='over')return {...b,v:'over'};
  if(!st.cur)return {...b,v:'board'};
  const common={kind:st.kind||null,cat:st.cat,val:st.val||null};
  if(st.stage==='wager')return {...b,...common,v:'wager',max:(st.maxw&&st.maxw[S.cid])??0,sent:sWag};
  if(st.stage==='clue')return {...b,...common,v:st.open?'open':'mc',opts:st.opts,mine:sMine,locked:!!st.locked,wager:st.kind?((st.wg&&st.wg[S.cid])||0):null};
  return {...b,...common,v:'result',opts:st.opts,right:st.right,mine:sMine,d:(st.res&&st.res[S.cid])||0,open:!!st.open,ap:st.ap||'',ok:!!(st.ok&&st.ok[S.cid])};
}
function stageFor(v){
  const top=v.cat?`<p class="scat">${v.kind?esc(v.kind)+' · ':''}${esc(v.cat)}${v.val&&!v.kind?' · '+v.val:''}</p>`:'';
  switch(v.v){
    case 'lobby':return `<p class="msg">You’re in, ${esc(v.name)}!</p><p class="sub">Wait for your teacher to start the game.</p>`;
    case 'board':return `<p class="msg">Watch the board.</p><p class="sub">Your teacher is picking the next clue.</p>`;
    case 'wager':return top+`<form data-form="wager"><label>Your wager (0 to ${fmt(v.max)})<input class="num" id="fwa" type="number" inputmode="numeric" min="0" max="${v.max}" step="1" required value="${v.sent??(v.max===0?0:'')}" placeholder="0"></label>
      <button class="btn" type="submit">${v.sent!=null?'Update wager':'Lock in wager'}</button></form>
      ${v.sent!=null?`<p class="sub">Wager locked in: <b>${fmt(v.sent)}</b>. You can change it until the clue appears.</p>`:`<p class="sub">Right answer: you win your wager. Wrong answer: you lose it.</p>`}`;
    case 'mc':return top+(v.wager!=null?`<p class="sub">Your wager: <b>${fmt(v.wager)}</b></p>`:'')+`<p class="sub">Read the clue on the board, then pick an answer.</p>
      <div class="choices">${(v.opts||[]).map((o,i)=>`<button class="choice${v.mine===i?' on':''}" data-pick="${i}" ${v.locked?'disabled':''} aria-pressed="${v.mine===i}"><span class="lt">${LET[i]}</span><span class="tx">${esc(o)}</span></button>`).join('')}</div>
      <p class="sub">${v.locked?(v.mine==null?'Time’s up. Answers are locked.':'Answers are locked. Watch the board!'):(v.mine==null?'Tap your answer.':'Answer saved. You can change it until time is up.')}</p>`;
    case 'open':return top+(v.wager!=null?`<p class="sub">Your wager: <b>${fmt(v.wager)}</b></p>`:'')+`<p class="sub">Read the clue on the board, then type your answer.</p>
      <form data-form="open" class="oa"><input type="text" id="foa" maxlength="30" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer" ${v.locked?'disabled':''} value="${esc(v.mine??'')}" placeholder="Your answer">
      <button class="btn" type="submit" ${v.locked?'disabled':''}>${v.mine!=null?'Update answer':'Submit answer'}</button></form>
      <p class="sub">${v.locked?(v.mine==null?'Time’s up. Answers are locked.':'Answers are locked. Watch the board!'):(v.mine==null?'Type a number or short answer, like 5 or (2, 3).':`Answer saved: <b>${esc(v.mine)}</b>. You can change it until time is up.`)}</p>`;
    case 'result':{
      const ok=v.open?v.ok:v.mine===v.right;
      const res=v.mine==null?`<p class="msg">No answer this time.</p>`:ok?`<p class="big good">${v.d?'+'+fmt(v.d):'✓'}</p><p class="msg">Correct!</p>`:`<p class="big bad">${v.d?'−'+fmt(-v.d):'✗'}</p><p class="msg">Not quite.</p>`;
      return top+res+(v.open?(v.ap?`<p class="sub">The answer was <b>${esc(v.ap)}</b></p>`:''):v.opts&&v.right!=null?`<p class="sub">The answer was <b>${LET[v.right]}. ${esc(v.opts[v.right])}</b></p>`:'');
    }
    case 'over':return `<p class="msg">Final score</p><p class="big">${fmt(v.score)}</p><p class="msg">You finished #${v.rank} of ${v.n}.</p><p class="sub">Great game, ${esc(v.name)}!</p>`;
  }
  return '';
}
function renderStudent(){
  let h=`<div class="pl">`;
  if(!S.active){
    h+=TITLE+(DB.mode==='local'?PRACTICE:'')+`<form data-form="join">
      ${sErr?`<p class="err" role="alert">${esc(sErr)}</p>`:''}
      <label>First name<input type="text" id="jn" maxlength="14" autocomplete="given-name" autocapitalize="words" required value="${esc(S.name)}" placeholder="Your first name"></label>
      <label>Game code<input type="text" id="jc" class="codein" maxlength="4" autocomplete="off" autocapitalize="characters" required value="${esc(S.code)}" placeholder="ABCD"></label>
      <button class="btn" type="submit" ${sBusy?'disabled':''}>${sBusy?'Joining…':'Join game'}</button></form>
      <p class="note">Use your first name only. The game code is on the projected screen.</p>
      <p class="foot" style="margin-top:auto">Teacher? <a href="?host">Host a game on the projector</a></p>`;
    $app.innerHTML=h+'</div>';lastKey='';return;
  }
  const v=compose();
  if(!v){h+=TITLE+`<div class="stage"><p class="msg">Joining game ${esc(S.code)}…</p><button class="linkbtn" data-act="leave">Cancel</button></div>`;$app.innerHTML=h+'</div>';lastKey='';return;}
  const {score:_s,rank:_r,n:_n,...rest}=v;
  const key=JSON.stringify(rest);
  const head=`<span class="nm">${esc(v.name)}</span><span class="rk">#${v.rank}<br>of ${v.n}</span><span class="sc">${fmt(v.score)}</span>`;
  const ae=document.activeElement;
  if(key===lastKey&&$('mehead')){$('mehead').innerHTML=head;return;}
  if(ae&&ae.id==='fwa'&&v.v==='wager'&&$('mehead')){$('mehead').innerHTML=head;lastKey=key;return;}
  if(ae&&ae.id==='foa'&&v.v==='open'&&!v.locked&&$('mehead')){$('mehead').innerHTML=head;lastKey=key;return;}
  lastKey=key;
  h+=`<div class="me" id="mehead">${head}</div><div class="stage">${stageFor(v)}</div><p class="foot"><button class="linkbtn" data-act="leave">Leave game</button></p>`;
  $app.innerHTML=h+'</div>';
}
function studentSubmit(e){
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  const kind=f.dataset.form;
  if(kind==='join'){
    if(sBusy)return;
    const name=cleanName($('jn').value),code=$('jc').value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
    if(!name){sErr='Type your first name (letters only).';return renderStudent();}
    if(code.length!==4){sErr='The game code is 4 letters.';S.name=name;S.code=code;return renderStudent();}
    if(S.code!==code||S.name!==name)S.cid=rid();
    S.name=name;S.code=code;sErr='';sSave();return sJoin(false);
  }
  if(kind==='open'&&S.active&&sCur&&sState&&sState.stage==='clue'&&!sState.locked){const a=$('foa').value.trim().slice(0,30);if(!a)return;sMine=a;DB.set(`sessions/${S.code}/answers/${sCur}/${S.cid}`,a).catch(()=>{});document.activeElement?.blur();renderStudent();return;}
  if(kind==='wager'&&S.active&&sCur){const w=Math.round(+$('fwa').value);if(!isFinite(w))return;sWag=w;DB.set(`sessions/${S.code}/wagers/${sCur}/${S.cid}`,w).catch(()=>{});document.activeElement?.blur();renderStudent();}
}
function studentClick(e){
  const pk=e.target.closest('[data-pick]');
  if(pk&&!pk.disabled&&sState&&sState.stage==='clue'&&!sState.locked&&sCur){
    const i=+pk.dataset.pick;sMine=i;
    DB.set(`sessions/${S.code}/answers/${sCur}/${S.cid}`,i).catch(()=>{});
    renderStudent();return;
  }
  const b=e.target.closest('[data-act]');if(!b)return;
  if(b.dataset.act==='leave'){DB.set(`sessions/${S.code}/players/${S.cid}/on`,false).catch(()=>{});sStop(false);}
}

/* ================= start ================= */
if(qs.has('host'))hostInit();else studentInit();
</script>
