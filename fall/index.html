<script>
/* =====================================================================
   FIREBASE SETUP
   The same Firebase project as Math 1 Linear Jeopardy (index.html at the top of this repo).
   Leave databaseURL empty to use practice mode (syncs only between tabs of one browser).
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBx-di3zHX-CwOUih35YEWRKndIRJJZh54",
  authDomain: "data-jeopardy.firebaseapp.com",
  databaseURL: "https://data-jeopardy-default-rtdb.firebaseio.com",
  projectId: "data-jeopardy",
  storageBucket: "data-jeopardy.firebasestorage.app",
  messagingSenderId: "1065653714728",
  appId: "1:1065653714728:web:decb90858e0b2c98501a1d"
};

/* ---------- tiny database layer: Firebase Realtime Database, or localStorage practice mode ---------- */
const DB=(()=>{
  if(FIREBASE_CONFIG.databaseURL&&typeof firebase!=='undefined'){
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      const f=firebase.database();
      return {mode:'live',
        set:(p,v)=>f.ref(p).set(v),
        remove:p=>f.ref(p).remove(),
        once:p=>f.ref(p).once('value').then(s=>s.val()),
        on:(p,cb)=>{const r=f.ref(p);const h=r.on('value',s=>cb(s.val()),()=>{});return ()=>r.off('value',h);},
        presence:p=>{f.ref('.info/connected').on('value',s=>{if(s.val()===true){f.ref(p).onDisconnect().set(false);f.ref(p).set(true);}});},
        connected:cb=>{f.ref('.info/connected').on('value',s=>cb(!!s.val()));}};
    }catch(e){}
  }
  const K='falling-objects-practice-db',subs=new Set();
  const read=()=>{try{return JSON.parse(localStorage.getItem(K)||'{}')||{};}catch(e){return {};}};
  const at=(o,p)=>p.split('/').filter(Boolean).reduce((a,k)=>a==null?null:(a[k]??null),o);
  const fire=()=>{const root=read();subs.forEach(s=>{const v=at(root,s.p),j=JSON.stringify(v);if(j!==s.last){s.last=j;s.cb(v);}});};
  const put=(p,v)=>{const root=read(),ks=p.split('/').filter(Boolean);let o=root;
    for(let i=0;i<ks.length-1;i++){if(typeof o[ks[i]]!=='object'||o[ks[i]]===null)o[ks[i]]={};o=o[ks[i]];}
    if(v==null)delete o[ks[ks.length-1]];else o[ks[ks.length-1]]=JSON.parse(JSON.stringify(v));
    try{localStorage.setItem(K,JSON.stringify(root));}catch(e){}setTimeout(fire,0);};
  addEventListener('storage',e=>{if(e.key===K)fire();});
  return {mode:'local',
    set:(p,v)=>{put(p,v);return Promise.resolve();},
    remove:p=>{put(p,null);return Promise.resolve();},
    once:p=>Promise.resolve(at(read(),p)),
    on:(p,cb)=>{const s={p,cb,last:undefined};subs.add(s);setTimeout(()=>{const v=at(read(),p);s.last=JSON.stringify(v);cb(v);},0);return ()=>subs.delete(s);},
    presence:p=>{put(p,true);addEventListener('pagehide',()=>put(p,false));},
    connected:cb=>cb(true)};
})();

/* ================= shared helpers ================= */
const APP='falling-objects-v1';
const ACT=window.FALL_ACTIVITY, STEPS=ACT.steps;
const MAX_PLAYERS=40;
const $app=document.getElementById('app'),$conn=document.getElementById('conn');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},del(k){try{localStorage.removeItem(k);}catch(e){}}};
const rand=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return [...a].map(b=>b.toString(16).padStart(2,'0')).join('');};
const joinUrl=()=>location.host+location.pathname.replace(/index\.html$/,'');
const CODE_CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ';
function newCode(){let c='';const a=new Uint8Array(4);crypto.getRandomValues(a);a.forEach(b=>c+=CODE_CHARS[b%CODE_CHARS.length]);return c;}
async function freeCode(){let code;for(let i=0;i<12;i++){code=newCode();if(!(await DB.once(`sessions/${code}/app`)))break;}return code;}
function cleanName(raw){
  let s=String(raw||'').normalize('NFC').trim().replace(/\s+/g,' ');
  if(!s)return {error:'Type your first name.'};
  if(s.includes(' '))return {error:'Use your first name only, with no spaces.'};
  if(!/^[\p{L}][\p{L}'’-]{0,14}\d?$/u.test(s))return {error:'Use letters only, up to 15 of them.'};
  return {name:s.charAt(0).toUpperCase()+s.slice(1)};
}
function parseNum(raw){
  let s=String(raw==null?'':raw).trim().replace(/[−–—]/g,'-').replace(/,/g,'').replace(/\s+/g,'');
  if(!s)return NaN;
  const m=s.match(/^(-?)(\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
  if(m){const d=parseFloat(m[3]);return d?(m[1]?-1:1)*parseFloat(m[2])/d:NaN;}
  if(/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s))return parseFloat(s);
  return NaN;
}
const fieldOk=(f,v)=>{const n=parseNum(v);return Number.isFinite(n)&&Math.abs(n-f.ans)<=(f.tol!=null?f.tol:1e-9);};
const gradable=st=>st.kind==='mc'||st.kind==='num';
function asArr(v,n){if(Array.isArray(v))return v;const o=v||{};return Array.from({length:n},(_,i)=>o[i]!=null?String(o[i]):'');}
function isCorrect(st,val){
  if(val==null)return null;
  if(st.kind==='mc')return val===st.correct;
  if(st.kind==='num'){const a=asArr(val,st.fields.length);return st.fields.every((f,i)=>fieldOk(f,a[i]));}
  return null;
}
function normNum(v){const n=parseNum(v);if(!Number.isFinite(n))return String(v||'').trim()||'—';return String(Math.round(n*1e6)/1e6).replace('-','−');}
function showVal(st,val){
  if(st.kind==='num'){const v=asArr(val,st.fields.length).map(normNum);return st.show?st.show(v):v.join(', ');}
  return String(val);
}

function aggregate(st){
  const players=realPlayers(), ans=(D.answers||{})[st.id]||{};
  const list=Object.entries(ans).filter(([cid])=>players[cid]);
  const out={count:list.length};
  if(st.kind==='mc'||st.kind==='poll'){out.counts=st.options.map(()=>0);list.forEach(([,a])=>{if(out.counts[a.val]!=null)out.counts[a.val]++;});}
  else if(st.kind==='num'&&st.table){
    out.cells=st.fields.map((f,i)=>{const g=new Map();let right=0;
      list.forEach(([,a])=>{const v=asArr(a.val,st.fields.length)[i],k=normNum(v);g.set(k,(g.get(k)||0)+1);if(fieldOk(f,v))right++;});
      return {right,top:[...g.entries()].sort((x,y)=>y[1]-x[1]).slice(0,3).map(([text,n])=>({text,n,ok:fieldOk(f,text.replace('−','-'))}))};});
  } else if(st.kind==='num'){
    const g=new Map();
    list.forEach(([,a])=>{const text=showVal(st,a.val);const e=g.get(text)||{text,n:0,ok:isCorrect(st,a.val)};e.n++;g.set(text,e);});
    out.groups=[...g.values()].sort((x,y)=>y.n-x.n);
  } else if(st.kind==='text'){
    const hidden=(D.hidden||{})[st.id]||{};
    out.texts=list.filter(([cid])=>!hidden[cid]).sort((x,y)=>(x[1].order||0)-(y[1].order||0)).map(([cid,a])=>({id:cid,text:String(a.val)}));
    out.hiddenCount=list.length-out.texts.length;
  }
  if(gradable(st))out.right=list.filter(([,a])=>isCorrect(st,a.val)).length;
  return out;
}
function buildHostView(){
  const state=D.state||{}, idx=state.idx||0, st=STEPS[idx-1];
  const players=realPlayers();
  const ans=st?((D.answers||{})[st.id]||{}):{};
  S={code:H.code,idx,total:STEPS.length,parts:ACT.parts,outline:STEPS,
    step:st?{...st,partName:partName(st.part)}:null,
    revealed:!!(state.rev||{})[idx], show:!!(state.show||{})[idx], startedAt:(state.t||{})[idx]||null,
    joined:Object.keys(players).length,
    responses:st&&st.kind!=='info'?aggregate(st):null,
    roster:Object.entries(players).map(([cid,p])=>({pid:cid,name:p.name,online:!!p.on,answered:!!ans[cid]})).sort((a,b)=>String(a.name).localeCompare(String(b.name)))};
}
async function startHost(h){

    D=v;buildHostView();if(moved){kickPid=null;}render();if(moved)window.scrollTo({top:0});
  }));
}
async function hostState(fn){
  const state=JSON.parse(JSON.stringify((D&&D.state)||{idx:0}));
  state.rev=state.rev||{};state.show=state.show||{};state.t=state.t||{};
  fn(state);
  try{await DB.set(`${base()}/state`,state);}catch(e){err='That didn’t save. Check your internet connection.';render();}
}

let PS={state:null,mine:undefined,stepId:null,kicked:false,loaded:false};
function buildPlayerView(){
  const state=PS.state||{}, idx=state.idx||0, st=STEPS[idx-1];
  const revealed=!!(state.rev||{})[idx];
  const mine=PS.mine&&st&&PS.stepId===st.id?PS.mine.val:null;
  S={code:P.code,name:P.name,idx,total:STEPS.length,step:st?{...st,partName:partName(st.part)}:null,revealed,
    mine:st&&st.kind==='num'&&mine!=null?asArr(mine,st.fields.length):mine,
    result:revealed&&mine!=null&&st&&gradable(st)?isCorrect(st,mine):null};
}
let mineUnsub=null;
function watchMine(st){
  if(mineUnsub){mineUnsub();mineUnsub=null;}
  PS.mine=undefined;PS.stepId=st?st.id:null;
  if(!st||st.kind==='info')return;
  mineUnsub=DB.on(`${base()}/answers/${st.id}/${P.cid}`,v=>{PS.mine=v;PS.stepId=st.id;buildPlayerView();render();});
}
function startPlayer(p){
  P=p;H=null;stopSubs();view='player';S=null;PS={state:null,mine:undefined,stepId:null};render();
  DB.presence(`${base()}/players/${P.cid}/on`);
  unsubs.push(DB.on(`${base()}/kicked/${P.cid}`,v=>{if(v){leavePlayer('Your teacher removed you from the session.');}}));
  unsubs.push(DB.on(`${base()}/state`,v=>{
    if(!P)return;
    if(!v){leavePlayer(null,true);return;}
    const prevIdx=PS.state?PS.state.idx||0:-1;
    PS.state=v;const idx=v.idx||0;
    if(idx!==prevIdx){status='';err='';watchMine(STEPS[idx-1]);window.scrollTo({top:0});}
    buildPlayerView();render();
  }));
  unsubs.push(()=>{if(mineUnsub){mineUnsub();mineUnsub=null;}});
}
function leavePlayer(msg,ended){
  stopSubs();store.del('fo-player');
  if(ended){S={...(S||{}),code:P.code,name:P.name,ended:true};P=null;view='player';return render();}
  P=null;S=null;view='join';err=msg||'';render();
}
function startTick(){
  clearInterval(tick);
  if(view!=='host'||!S||!S.startedAt||!S.step)return;
  const upd=()=>{const el=document.getElementById('timer');if(!el||!S||!S.startedAt||!S.step)return;
    const sec=Math.max(0,Math.floor((Date.now()-S.startedAt)/1000)),goal=S.step.minutes*60;
    el.querySelector('.tt').textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')} / ${S.step.minutes} min`;
    el.querySelector('i').style.width=Math.min(100,goal?sec/goal*100:0)+'%';
    el.classList.toggle('over',sec>goal);};
  upd();tick=setInterval(upd,1000);
}

function hostOptionsPreview(st){
  if(st.kind!=='mc'&&st.kind!=='poll')return '';
  return `<div class="choices ${st.grid?'g2':''}">${st.options.map((o,i)=>`<div class="choice ${S.revealed&&st.correct===i?'right':''}">${st.grid?o:`<span>${o}</span>`}</div>`).join('')}</div>`;
}
function hostKeyHTML(st){
  if(!S.revealed)return '';
  if(st.answerText!=null||st.kind==='mc'){const at=st.answerText!=null?st.answerText:(st.labels||st.options.map(strip))[st.correct];
    return `<div class="answerkey"><span class="k">Answer: ${esc(at)}</span><p>${esc(st.explain)}</p></div>`;}
  return st.explain?`<div class="answerkey takeaway"><span class="k">Takeaway</span><p>${esc(st.explain)}</p></div>`:'';
}
function respHTML(st,r){
  const n=r?r.count:0, grad=gradable(st);
  const revealLbl=S.revealed?(grad?'Hide answer':'Hide takeaway'):(grad?'Reveal answer':'Show takeaway');
  let head=`<div class="resphead"><span class="n">${n}<small> of ${S.joined} answered</small></span><span class="sp"></span>
    <button class="btn ghost small" data-act="show">${S.show?'Hide responses':'Show responses'}</button>
    <button class="btn ${S.revealed?'ghost':'drop'} small" data-act="reveal">${revealLbl}</button></div>`;
  if(S.revealed&&grad&&n)head+=`<p class="note"><span class="pct">${Math.round(r.right/n*100)}%</span> correct (${r.right} of ${n})</p>`;
  if(!S.show)return head+`<div class="veil"><strong>Responses are hidden</strong><span>Students’ answers appear here without names when you choose Show responses.</span></div>`;
  if(!n)return head+`<div class="veil">Waiting for answers…</div>`;
  if(st.kind==='mc'||st.kind==='poll'){
    const max=Math.max(1,...r.counts);
    return head+`<div class="bars">${r.counts.map((c,i)=>{const cls=S.revealed&&st.kind==='mc'?(i===st.correct?'ok':'no'):'';
      return `<div class="bar ${cls}"><span class="bl">${esc((st.labels||[])[i]||strip(st.options[i]))}</span><span class="bn">${c}</span><span class="track"><i style="width:${c/max*100}%"></i></span></div>`;}).join('')}</div>`;
  }
  if(st.kind==='num'&&st.table){
    const rows=st.table.rows.map(row=>`<tr>${row.map(c=>{if(typeof c!=='object')return `<td>${esc(c)}</td>`;const cell=r.cells[c.f];
      const items=cell.top.map(t=>`<span class="${S.revealed?(t.ok?'ok':'no'):''}">${esc(t.text)} <small>×${t.n}</small></span>`).join('');
      return `<td><div class="celltop">${items}${S.revealed?`<span class="pct">${Math.round(cell.right/n*100)}%</span>`:''}</div></td>`;}).join('')}</tr>`).join('');
    return head+`<p class="note">Most common answers in each blank</p><div class="tblwrap"><table class="dt"><thead><tr>${st.table.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  if(st.kind==='num'){
    const g=r.groups.slice(0,10),max=Math.max(1,...g.map(x=>x.n)),more=r.groups.slice(10).reduce((a,x)=>a+x.n,0);
    return head+`<div class="bars">${g.map(x=>`<div class="bar ${S.revealed?(x.ok?'ok':'no'):''}"><span class="bl" style="font-family:var(--mono)">${esc(x.text)}</span><span class="bn">${x.n}</span><span class="track"><i style="width:${x.n/max*100}%"></i></span></div>`).join('')}</div>${more?`<p class="note">+ ${more} other answer${more===1?'':'s'}</p>`:''}`;
  }
  if(st.kind==='text'){
    return head+`<div class="cards">${r.texts.map(t=>`<div class="card"><p>${esc(t.text)}</p><button class="x" data-act="hide" data-rid="${esc(t.id)}" aria-label="Hide this response" title="Hide from the board">×</button></div>`).join('')}</div>
      ${r.hiddenCount?`<p class="note">${r.hiddenCount} hidden · <button class="btn ghost small" data-act="unhide">Show hidden</button></p>`:''}`;
  }
  return head;
}

  let ui='';
  if(st.kind==='info') ui=`<div class="result na"><span class="rh">Talk it over</span><p>${esc(st.prompt)}</p></div>`;
  else ui=`<p class="prompt">${esc(st.prompt)}</p>`+answerUI(st)+resultHTML(st);
  $app.innerHTML=bar+`<section class="panel sstage"><span class="eyebrow">Part ${st.part} · ${esc(st.partName)}</span><h2>${esc(st.title)}</h2><div class="content">${st.html}</div>${ui}</section><p class="err">${esc(err)}</p>`;
}
function draftOf(st){
  if(drafts[st.id]==null){
    if(st.kind==='num')drafts[st.id]=Array.isArray(S.mine)?S.mine.slice():st.fields.map(()=> '');
    else if(st.kind==='text')drafts[st.id]=typeof S.mine==='string'?S.mine:'';
  }
  return drafts[st.id];
}
function inp(st,i,dis){const d=draftOf(st);return `<input type="text" id="f-${st.id}-${i}" data-field="${i}" inputmode="decimal" autocomplete="off" spellcheck="false" value="${esc(d[i])}" aria-label="${esc(strip(st.fields[i].label))}" ${dis?'disabled':''}>`;}
function answerUI(st){
  const dis=S.revealed;
  if(st.kind==='mc'||st.kind==='poll'){
    return `<div class="choices ${st.grid?'g2':''}" role="group" aria-label="Choices">${st.options.map((o,i)=>{
      const cls=[S.mine===i?'sel':'',dis&&st.kind==='mc'&&st.correct===i?'right':''].join(' ');
      return `<button class="choice ${cls}" data-choice="${i}" ${dis?'disabled':''} aria-pressed="${S.mine===i}">${st.grid?o:`<span>${o}</span>`}</button>`;}).join('')}</div>`+statusLine(st);
  }
  if(st.kind==='num'){
    let h='';
    if(st.table){
      h=`<div class="tblwrap"><table class="dt"><thead><tr>${st.table.head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${st.table.rows.map(row=>`<tr>${row.map(c=>typeof c==='object'?`<td>${inp(st,c.f,dis)}</td>`:`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    } else {
      const inl=st.inline||[];
      if(inl.length){h+=`<div class="frow inl">${inl.map(i=>`<span class="nw"><span class="fl" style="font-family:var(--mono)">${st.fields[i].label}</span>${inp(st,i,dis)}<span>${esc(st.fields[i].post||'')}</span></span>`).join('')}</div>`;}
      st.fields.forEach((f,i)=>{if(inl.includes(i))return;h+=`<label class="frow"><span class="fl">${f.label}</span>${inp(st,i,dis)}<span>${esc(f.post||'')}</span></label>`;});
      h=`<div class="fields">${h}</div>`;
    }
    return `<form class="ansform" style="display:flex;flex-direction:column;gap:12px">${h}${dis?'':`<div><button class="btn drop" type="submit" ${busy?'disabled':''}>${S.mine!=null?'Update answer':'Submit'}</button></div>`}</form>`+statusLine(st);
  }
  if(st.kind==='text'){
    const d=draftOf(st);
    return `<form class="ansform" style="display:flex;flex-direction:column;gap:12px"><textarea id="t-${esc(st.id)}" data-text maxlength="400" ${dis?'disabled':''} aria-label="Your answer">${esc(d)}</textarea>${dis?'':`<div><button class="btn drop" type="submit" ${busy?'disabled':''}>${S.mine!=null?'Update answer':'Submit'}</button></div>`}</form>`+statusLine(st);
  }
  return '';
}
function statusLine(st){
  if(S.revealed)return '';
  if(status)return `<p class="status sent">${esc(status)}</p>`;
  if(S.mine!=null)return `<p class="status sent">Answer sent. You can change it until your teacher reveals the answer.</p>`;
  return st.kind==='text'?`<p class="status">Your answer shows on the board without your name.</p>`:'';
}
function resultHTML(st){
  if(!S.revealed)return '';
  const ex=st.explain?`<p>${esc(st.explain)}</p>`:'';
  if(gradable(st)){
    const at=st.answerText!=null?st.answerText:(st.labels||st.options.map(strip))[st.correct];
    if(S.mine==null)return `<div class="result na"><span class="rh">No answer sent</span><p><b>Answer:</b> ${esc(at)}</p>${ex}</div>`;
    return `<div class="result ${S.result?'ok':'no'}"><span class="rh">${S.result?'Correct!':'Not quite'}</span>${S.result?'':`<p><b>Answer:</b> ${esc(at)}</p>`}${ex}</div>`;
  }
  return st.explain?`<div class="result na"><span class="rh">Takeaway</span>${ex}</div>`:'';
}

/* ================= actions ================= */
async function sendAnswer(val){
  if(!P||!S||!S.step||S.revealed)return;
  const st=S.step;
  if(st.kind==='num'){
    val=val.map(x=>String(x==null?'':x).trim().slice(0,24));
    if(val.some(x=>!x)){err='Fill in every blank.';return render();}
    const bad=val.find(x=>!Number.isFinite(parseNum(x)));
    if(bad!=null){err=`“${bad}” isn’t a number. Use digits, a decimal point, a minus sign or a fraction like 3/4.`;return render();}
  } else if(st.kind==='text'){
    val=String(val||'').replace(/\s+/g,' ').trim().slice(0,400);
    if(!val){err='Type your answer first.';return render();}
  }
  busy=true;err='';render();
  const ok=drafts['_order_'+st.id]||(drafts['_order_'+st.id]=Math.random());saveDrafts();
  try{await DB.set(`${base()}/answers/${st.id}/${P.cid}`,{val,order:ok,at:Date.now()});status='Answer sent. You can change it until your teacher reveals the answer.';}
  catch(x){err='Your answer didn’t send. Check your internet connection and try again.';status='';}
  busy=false;render();
}
async function doJoin(){
  const code=document.getElementById('jcode').value.trim().toUpperCase(),raw=document.getElementById('jname').value;
  if(code.length!==4){err='The code has 4 letters.';return render();}
  const n=cleanName(raw);if(n.error){err=n.error;return render();}
  busy=true;err='';render();
  try{
    const app=await DB.once(`sessions/${code}/app`);
    if(app!==APP){busy=false;err='No class session has that code. Check the code on the board.';return render();}
    const players=(await DB.once(`sessions/${code}/players`))||{};
    if(Object.values(players).some(p=>String(p.name).toLowerCase()===n.name.toLowerCase())){busy=false;err=`Someone already joined as ${n.name}. Add a number, like ${n.name}2.`;return render();}
    if(Object.keys(players).length>=MAX_PLAYERS){busy=false;err='This session is full.';return render();}
    const cid=rand(8);
    await DB.set(`sessions/${code}/players/${cid}`,{name:n.name,on:true});
    const p={code,cid,name:n.name};store.set('fo-player',p);busy=false;startPlayer(p);
  }catch(x){busy=false;err='Couldn’t reach the class session. Check your internet connection and try again.';render();}
}
async function rejoin(){
  const p=store.get('fo-player');if(!p)return;
  const me=await DB.once(`sessions/${p.code}/players/${p.cid}`);
  if(!me){store.del('fo-player');err='That session has ended, or you were removed. Join again with the code on the board.';return go('join');}
  startPlayer(p);
}
async function createSession(){
  busy=true;err='';render();
  try{
    const code=await freeCode(),key=rand(12);
    await DB.set(`sessions/${code}`,{app:APP,key,created:Date.now(),state:{idx:0}});
    const h={code,key};store.set('fo-host',h);busy=false;D=null;startHost(h);
  }catch(x){busy=false;err='Couldn’t create a session. Check your internet connection and try again.';render();}
}
async function rehost(){
  const h=store.get('fo-host');if(!h)return;
  const [app,key]=await Promise.all([DB.once(`sessions/${h.code}/app`),DB.once(`sessions/${h.code}/key`)]);
  if(app!==APP||key!==h.key){store.del('fo-host');err='That session has ended.';return go('home');}
  D=null;startHost(h);
}

/* ================= events ================= */
document.addEventListener('input',e=>{
  if(view!=='player'||!S||!S.step)return;
  const st=S.step;
  if(e.target.dataset.field!=null){draftOf(st)[+e.target.dataset.field]=e.target.value;saveDrafts();}
  else if(e.target.hasAttribute('data-text')){drafts[st.id]=e.target.value;saveDrafts();}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='joinForm')return doJoin();
  if(e.target.classList.contains('ansform'))return sendAnswer(S.step.kind==='num'?draftOf(S.step).slice():draftOf(S.step));
});
document.addEventListener('click',async e=>{
  const g=e.target.closest('[data-go]');
  if(g){if(g.dataset.go==='home'&&view==='player'){stopSubs();store.del('fo-player');P=null;S=null;}return go(g.dataset.go);}
  const c=e.target.closest('[data-choice]');
  if(c&&view==='player'&&!c.disabled){const i=+c.dataset.choice;S.mine=i;render();return sendAnswer(i);}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='create')createSession();
  else if(a==='rehost')rehost();
  else if(a==='rejoin')rejoin();
  else if(a==='go')hostGo(+b.dataset.idx);
  else if(a==='reveal')hostState(s=>{const i=s.idx;s.rev[i]=!s.rev[i];if(s.rev[i])s.show[i]=true;});
  else if(a==='show')hostState(s=>{s.show[s.idx]=!s.show[s.idx];});
  else if(a==='hide'&&S.step)DB.set(`${base()}/hidden/${S.step.id}/${b.dataset.rid}`,true);
  else if(a==='unhide'&&S.step)DB.remove(`${base()}/hidden/${S.step.id}`);
  else if(a==='drawer'){drawer=!drawer;kickPid=null;endAsk=false;render();}
  else if(a==='kick'){kickPid=b.dataset.pid;render();}
  else if(a==='kickno'){kickPid=null;render();}
  else if(a==='kickyes'){const pid=b.dataset.pid;kickPid=null;await DB.set(`${base()}/kicked/${pid}`,true);await DB.remove(`${base()}/players/${pid}`);}
  else if(a==='end'){endAsk=true;render();}
  else if(a==='endno'){endAsk=false;render();}
  else if(a==='endyes'){const path=base();stopSubs();store.del('fo-host');H=null;S=null;D=null;drawer=false;endAsk=false;await DB.remove(path);go('home');}
});
document.addEventListener('keydown',e=>{
  if(view!=='host'||!S||e.target.closest('input,textarea'))return;
  if(e.key==='ArrowRight'&&S.idx<S.total)hostGo(S.idx+1);
  if(e.key==='ArrowLeft'&&S.idx>0)hostGo(S.idx-1);
});

/* ================= start ================= */
(()=>{
  const q=new URLSearchParams(location.search);
  if(q.get('code')&&!store.get('fo-player'))view='join';
  if(q.has('host')&&store.get('fo-host'))return rehost();
  render();
})();
</script>
</body>
</html>
